<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Sticky Notes</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        width: 260px;
        background: #fffef3;
        color: #333;
      }
      .wrap {
        padding: 14px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      p {
        margin: 6px 0;
        font-size: 12px;
        line-height: 1.4;
      }
      kbd {
        background: #f0f0f0;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 1px 4px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Agent Sticky Notes</h1>
      <p>The floating panel appears directly on webpages.</p>
      <p>Set <strong>Your name</strong> in the header to copy as: date, name, then note.</p>
      <p>Default close/reopen: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>X</kbd></p>
      <p>You can customize shortcuts inside the panel settings.</p>
    </div>
  </body>
</html>
