# Builds Windows .exe (NSIS) and macOS .dmg (Intel + Apple Silicon).
# DMGs must be produced on a Mac runner.

name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # Skip code signing in CI (no certs on GitHub runners — avoids common exit 1 failures).
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: release/*.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg
          if-no-files-found: error
